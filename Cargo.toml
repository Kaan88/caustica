[package]
name = "cornell-rtx"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
egui = "0.31.1"
egui-winit = { version = "0.31.1", default-features = false, features = ["clipboard", "links"] }
glam = { version = "0.30", features = ["serde", "bytemuck"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "exr", "hdr"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winit = "0.30"
gilrs = "0.11"
qrcode = { version = "0.14", default-features = false }
tobj = "4"
gltf = { version = "1", default-features = false, features = ["import", "utils", "names", "KHR_materials_emissive_strength", "KHR_materials_transmission", "KHR_materials_ior", "extensions"] }
rfd = "0.15"
ureq = { version = "2", default-features = false, features = ["native-tls", "gzip"] }
native-tls = "0.2"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
raw-window-handle = "0.6"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D12", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_System_Threading", "Win32_Security", "Win32_System_Diagnostics_Debug", "Win32_Devices_Display", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }
rapier3d = "0.36.1"

[build-dependencies]
cc = "1"

[profile.release]
lto = "thin"
codegen-units = 1

