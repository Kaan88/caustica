[package]
name = "caustica"
version = "0.11.1"
edition = "2024"
license = "MIT"
build = "build.rs"

[dependencies]
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
egui = { version = "0.37", features = ["default_fonts", "monochrome_emoji_fonts"] }
egui-winit = { version = "0.37", default-features = false, features = ["clipboard", "links"] }
glam = { version = "0.30", features = ["serde", "bytemuck"] }
# Multi-layer EXR (AOVs); the image crate writes single-layer files only.
exr = { version = "1.74", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "exr", "hdr"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winit = "0.30"
gilrs = "0.11"
qrcode = { version = "0.14", default-features = false }
tobj = "4"
gltf = { version = "1", default-features = false, features = ["import", "utils", "names", "KHR_materials_emissive_strength", "KHR_materials_transmission", "KHR_materials_ior", "KHR_materials_volume", "KHR_lights_punctual", "KHR_texture_transform", "extensions"] }
rfd = "0.15"
ureq = { version = "2", default-features = false, features = ["native-tls", "gzip"] }
native-tls = "0.2"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
raw-window-handle = "0.6"
rapier3d = "0.36.1"
rhai = { version = "1.27.0", features = ["sync"] }
cpal = "0.18.2"
rustfft = "6.4.1"
ash = "0.38"
ash-window = "0.13"
# Intel Open Image Denoise, loaded at run time (src/oidn.rs). Already in the tree through ash.
libloading = "0.8"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D12", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_Security", "Win32_System_Diagnostics_Debug", "Win32_Devices_Display", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Graphics_Imaging", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_Ole"] }

[target.'cfg(not(windows))'.dependencies]
libc = "0.2"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

[build-dependencies]
cc = "1"

[profile.release]
lto = "thin"
codegen-units = 1

