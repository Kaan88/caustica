[package]
name = "cornell-rtx"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
egui = "0.31.1"
egui-winit = { version = "0.31.1", default-features = false, features = ["clipboard", "links"] }
glam = { version = "0.30", features = ["serde", "bytemuck"] }
image = { version = "0.25", default-features = false, features = ["png", "exr"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winit = "0.30"
raw-window-handle = "0.6"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D12", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_System_Threading", "Win32_Security", "Win32_System_Diagnostics_Debug"] }

[build-dependencies]
cc = "1"

[profile.release]
lto = "thin"
codegen-units = 1

