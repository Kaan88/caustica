# Every push to main and every pull request runs the checks (cargo fmt --check, clippy
# -D warnings, cargo test --locked) on Windows and Linux. Pushing a tag v<X.Y.Z> also builds
# every package and publishes the GitHub release: Windows setup.exe and zip, Linux AppImage,
# tar.gz, .deb, .pkg.tar.zst and .rpm, one SHA256SUMS over all of them (the app's self-update
# reads it, src/update.rs) and the commits since the previous tag as notes:
#   git tag v0.14.0 && git push origin v0.14.0
# The tag must equal Cargo.toml's version (the jobs fail otherwise). A manual run
# (workflow_dispatch) on any branch builds all packages as workflow artifacts, no release.
# tools/release.ps1 stays as the local fallback. Standard GitHub-hosted runners only.
name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# A newer push to the same ref cancels the older run; tag runs always finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}
env:
  # Packages (and their asset downloads) only for a release tag or a manual run.
  PACKAGE: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_type == 'tag') }}
  RELEASE: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
  NFPM_VERSION: 2.49.0
  NFPM_SHA256: 2afaa5ffb5e3493402e31e7c67a5a1fb42133e3f66fc315ca0051934125561c7
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Pinned to the owner's local toolchain, so CI clippy flags what local clippy flags.
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Vendor SDKs (DLSS, FSR, XeSS) and ffmpeg, pinned by commit / hash in the script.
      - uses: actions/cache@v4
        with:
          path: vendor
          key: vendor-${{ hashFiles('tools/setup.ps1') }}
      - name: Fetch SDKs
        shell: pwsh
        run: ./tools/setup.ps1 -SkipBuild
      # CAUSTICA_VERSION: the tag on a release (checked against Cargo.toml), else Cargo.toml's
      # version with -ci.<sha> (what the build reports and the packages are named by).
      - name: Version
        shell: pwsh
        run: |
          $base = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          if ($env:RELEASE -eq 'true') {
            $version = $env:GITHUB_REF_NAME.TrimStart('v')
            if ($version -ne $base) { throw "Tag $env:GITHUB_REF_NAME does not match Cargo.toml's version $base" }
          } else {
            $version = "$base-ci.$($env:GITHUB_SHA.Substring(0, 7))"
          }
          "CAUSTICA_VERSION=$version" >> $env:GITHUB_ENV
          "Version $version"
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked -- -D warnings
      # The runner has no GPU: unit tests only (the self-test needs D3D12 with DXR).
      - name: Test
        run: cargo test --locked
      - name: Release build
        if: env.PACKAGE == 'true'
        run: cargo build --release --locked
      # The shipped scenes' models, HDRIs and textures (~870 MB, gitignored, pinned by SHA-256 in
      # the script) go into the release zip and installer. Cached by the script's hash, so a
      # release only downloads what changed.
      - uses: actions/cache@v4
        if: env.PACKAGE == 'true'
        with:
          path: |
            scenes/models
            scenes/hdri
            scenes/textures
          key: assets-${{ runner.os }}-${{ hashFiles('tools/fetch_assets.ps1', 'tools/sponza.sha256') }}
      - name: Fetch assets
        if: env.PACKAGE == 'true'
        shell: pwsh
        run: ./tools/fetch_assets.ps1
      # The exe with the DLLs and ffmpeg build.rs copied next to it, the scene packs with the
      # assets above, and the README.
      - name: Package
        if: env.PACKAGE == 'true'
        shell: pwsh
        run: |
          $name = "caustica-v$env:CAUSTICA_VERSION"
          $dist = "dist/$name"
          New-Item -ItemType Directory -Force $dist | Out-Null
          Copy-Item target/release/caustica.exe, target/release/*.dll $dist
          # The D3D12 Agility SDK runtime (track 20: Shader Model 6.9, SER), found as .\D3D12\.
          Copy-Item -Recurse target/release/D3D12 $dist/D3D12
          if (Test-Path target/release/ffmpeg.exe) { Copy-Item target/release/ffmpeg.exe $dist }
          Copy-Item -Recurse scenes $dist/scenes
          Copy-Item README.md $dist
          Copy-Item THIRD-PARTY-NOTICES.md $dist
          New-Item -ItemType Directory -Force "$dist/licenses" | Out-Null
          Copy-Item vendor/dlss/LICENSE.txt "$dist/licenses/NVIDIA-DLSS.txt"
          Copy-Item vendor/fsr/Kits/FidelityFX/docs/license.md "$dist/licenses/AMD-FSR.md"
          Copy-Item vendor/xess/LICENSE.txt "$dist/licenses/Intel-XeSS.txt"
          Copy-Item vendor/oidn/doc/LICENSE.txt "$dist/licenses/OIDN-Apache-2.0.txt"
          Copy-Item vendor/oidn/doc/third-party-programs.txt "$dist/licenses/OIDN-third-party-programs.txt"
          Copy-Item vendor/oidn/doc/third-party-programs-oneTBB.txt "$dist/licenses/OIDN-oneTBB-third-party-programs.txt"
          Copy-Item vendor/agility/LICENSE.txt "$dist/licenses/Microsoft-Agility.txt"
          Copy-Item vendor/ffmpeg/LICENSE "$dist/licenses/FFmpeg.txt"
          Copy-Item LICENSE "$dist/licenses/Caustica-MIT.txt"
          Copy-Item assets/THREE-LICENSE.txt "$dist/licenses/three.js-MIT.txt"
          Copy-Item assets/CREDITS.md "$dist/licenses/Mesh-credits.md"
          Compress-Archive -Path $dist -DestinationPath "dist/$name.zip"
          "ZIP=dist/$name.zip" >> $env:GITHUB_ENV
          "DIST=$((Resolve-Path $dist).Path)" >> $env:GITHUB_ENV
      # The installer (Inno Setup, per-user).
      - name: Installer
        if: env.PACKAGE == 'true'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          # The script needs Inno Setup 6.3+ (x64compatible); the image may ship an older one.
          choco upgrade innosetup -y --no-progress | Out-Null
          & $iscc /Qp "/DAppVersion=$env:CAUSTICA_VERSION" "/DSourceDir=$env:DIST" installer/caustica.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "SETUP=dist/caustica-v$env:CAUSTICA_VERSION-setup.exe" >> $env:GITHUB_ENV
      - uses: actions/upload-artifact@v4
        if: env.PACKAGE == 'true'
        with:
          name: windows
          path: |
            ${{ env.ZIP }}
            ${{ env.SETUP }}
          if-no-files-found: error

  # Built on ubuntu-24.04 (glibc 2.39): the vendored DXC release needs glibc 2.38, so 22.04 cannot run it. No GPU
  # on the runner: the tests are CPU-only, and the AppImage ships without prebuilt thumbnails
  # (a fresh install renders them on first open).
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Pinned to the owner's local toolchain, so CI clippy flags what local clippy flags.
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev libudev-dev \
            libxkbcommon-dev libwayland-dev libx11-dev unzip
      # DXC (SPIR-V), OIDN, the DLSS and XeSS headers and the Vulkan headers.
      - uses: actions/cache@v4
        with:
          path: vendor
          key: vendor-linux-${{ hashFiles('tools/setup.sh') }}
      - name: Fetch SDKs
        run: sh tools/setup.sh
      - name: Version
        run: |
          base=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "$RELEASE" = true ]; then
            version=${GITHUB_REF_NAME#v}
            if [ "$version" != "$base" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml's version $base"
              exit 1
            fi
          else
            version=$base
          fi
          echo "PKG_VERSION=$version" >> "$GITHUB_ENV"
          echo "CAUSTICA_VERSION=$([ "$RELEASE" = true ] && echo "$version" || echo "$version-ci.${GITHUB_SHA::7}")" >> "$GITHUB_ENV"
          echo "Version $version"
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked -- -D warnings
      - name: Test
        run: cargo test --locked
      - uses: actions/cache@v4
        if: env.PACKAGE == 'true'
        with:
          path: |
            scenes/models
            scenes/hdri
            scenes/textures
          key: assets-${{ runner.os }}-${{ hashFiles('tools/fetch_assets.ps1', 'tools/fetch_assets.sh', 'tools/sponza.sha256') }}
      - name: Fetch assets
        if: env.PACKAGE == 'true'
        run: sh tools/fetch_assets.sh
      # nfpm (the .deb, .pkg.tar.zst and .rpm), pinned by version and checksum.
      - name: Install nfpm
        if: env.PACKAGE == 'true'
        run: |
          file=nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz
          curl -fsSL -o "$RUNNER_TEMP/$file" "https://github.com/goreleaser/nfpm/releases/download/v$NFPM_VERSION/$file"
          echo "$NFPM_SHA256  $RUNNER_TEMP/$file" | sha256sum -c -
          mkdir "$RUNNER_TEMP/nfpm"
          tar -xzf "$RUNNER_TEMP/$file" -C "$RUNNER_TEMP/nfpm" nfpm
          echo "$RUNNER_TEMP/nfpm" >> "$GITHUB_PATH"
      # Release build and AppImage (tools/appimage.sh), leaving its packed tree in dist/stage,
      # which the tar.gz and the distro packages are made from.
      - name: AppImage
        if: env.PACKAGE == 'true'
        run: CAUSTICA_NO_THUMBNAILS=1 STAGE_OUT=dist/stage sh tools/appimage.sh
      - name: tar.gz and distro packages
        if: env.PACKAGE == 'true'
        run: sh tools/package_linux.sh dist/stage "$PKG_VERSION" dist
      - uses: actions/upload-artifact@v4
        if: env.PACKAGE == 'true'
        with:
          name: linux
          path: |
            dist/Caustica-*-x86_64.AppImage
            dist/caustica-*-x86_64.tar.gz
            dist/caustica_*_amd64.deb
            dist/caustica-*-x86_64.pkg.tar.zst
            dist/caustica-*.x86_64.rpm
          if-no-files-found: error

  # A release tag: every asset into one release with a single SHA256SUMS, which the app's
  # self-update checks (sha256sum format, src/update.rs).
  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Checksums and notes
        run: |
          cd assets
          ls -l
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
          cd ..
          # Notes: every commit subject since the previous release tag (HEAD carries this one).
          previous=$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)
          if [ -n "$previous" ]; then
            { echo "Changes since $previous"; echo; git log "$previous..HEAD" --no-merges --format='- %s (%h)'; } > notes.md
          else
            { echo "First release"; echo; git log HEAD --no-merges --format='- %s (%h)'; } > notes.md
          fi
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Caustica ${{ github.ref_name }}
          body_path: notes.md
          files: assets/*
          fail_on_unmatched_files: true
