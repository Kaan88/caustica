# Roadmap 17b: build and check every push to main and every PR on a Windows runner. Only a
# pushed tag v<X.Y.Z> makes a release: that version, an installer, a zip of the app and the
# commits since the previous tag. Tag when a feature is complete or a fix warrants it:
#   git tag v0.2.0 && git push origin v0.2.0
# Keep Cargo.toml's version in step with the latest tag (untagged builds say <it>-ci.<sha>).
# A manual run (workflow_dispatch) on any branch builds the installer without releasing.
name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
# A newer push to the same branch cancels the older run; tag runs always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}
jobs:
  build:
    runs-on: windows-latest
    env:
      RELEASE: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Vendor SDKs (DLSS, FSR, XeSS) and ffmpeg, pinned by commit / hash in the script.
      - uses: actions/cache@v4
        with:
          path: vendor
          key: vendor-${{ hashFiles('tools/setup.ps1') }}
      - name: Fetch SDKs
        shell: pwsh
        run: ./tools/setup.ps1 -SkipBuild
      - name: Version
        shell: pwsh
        run: |
          if ($env:RELEASE -eq 'true') {
            $version = $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            $base = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
            $version = "$base-ci.$($env:GITHUB_SHA.Substring(0, 7))"
          }
          "CAUSTICA_VERSION=$version" >> $env:GITHUB_ENV
          "Version $version"
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked -- -D warnings
      # The runner has no GPU: unit tests only (the self-test needs D3D12 with DXR).
      - name: Test
        run: cargo test --locked
      - name: Release build
        run: cargo build --release --locked
      # The shipped scenes' models, HDRIs and textures (~870 MB, gitignored, pinned by SHA-256 in
      # the script) go into the release zip and installer; plain pushes and PRs package without
      # them. Cached by the script's hash, so a release only downloads what changed.
      - uses: actions/cache@v4
        if: env.RELEASE == 'true' || github.event_name == 'workflow_dispatch'
        with:
          path: |
            scenes/models
            scenes/hdri
            scenes/textures
          key: assets-${{ hashFiles('tools/fetch_assets.ps1', 'tools/sponza.sha256') }}
      - name: Fetch assets
        if: env.RELEASE == 'true' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: ./tools/fetch_assets.ps1
      # The exe with the DLLs and ffmpeg build.rs copied next to it, the scene packs (with the
      # assets above on releases) and the README.
      - name: Package
        shell: pwsh
        run: |
          $name = "caustica-v$env:CAUSTICA_VERSION"
          $dist = "dist/$name"
          New-Item -ItemType Directory -Force $dist | Out-Null
          Copy-Item target/release/caustica.exe, target/release/*.dll $dist
          # The D3D12 Agility SDK runtime (track 20: Shader Model 6.9, SER), found as .\D3D12\.
          Copy-Item -Recurse target/release/D3D12 $dist/D3D12
          if (Test-Path target/release/ffmpeg.exe) { Copy-Item target/release/ffmpeg.exe $dist }
          Copy-Item -Recurse scenes $dist/scenes
          Copy-Item README.md $dist
          Compress-Archive -Path $dist -DestinationPath "dist/$name.zip"
          "ZIP=dist/$name.zip" >> $env:GITHUB_ENV
          "DIST=$((Resolve-Path $dist).Path)" >> $env:GITHUB_ENV
      # The installer (Inno Setup, per-user) for releases and manual runs; not for PRs.
      - name: Installer
        if: env.RELEASE == 'true' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          # The script needs Inno Setup 6.3+ (x64compatible); the image may ship an older one.
          choco upgrade innosetup -y --no-progress | Out-Null
          & $iscc /Qp "/DAppVersion=$env:CAUSTICA_VERSION" "/DSourceDir=$env:DIST" installer/caustica.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "SETUP=dist/caustica-v$env:CAUSTICA_VERSION-setup.exe" >> $env:GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: caustica-v${{ env.CAUSTICA_VERSION }}
          path: |
            ${{ env.ZIP }}
            ${{ env.SETUP }}
      # Notes: every commit subject since the previous release tag.
      - name: Release notes
        if: env.RELEASE == 'true'
        shell: pwsh
        run: |
          # The tag before this one (HEAD itself carries the new tag).
          $previous = git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>$null
          $range = if ($previous) { "$previous..HEAD" } else { 'HEAD' }
          $log = git log $range --no-merges --format='- %s (%h)'
          $header = if ($previous) { "Changes since $previous`n" } else { "First release`n" }
          Set-Content -Encoding utf8 dist/notes.md ($header + "`n" + ($log -join "`n"))
      - name: GitHub release
        if: env.RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.CAUSTICA_VERSION }}
          target_commitish: ${{ github.sha }}
          name: Caustica v${{ env.CAUSTICA_VERSION }}
          body_path: dist/notes.md
          files: |
            ${{ env.SETUP }}
            ${{ env.ZIP }}
